server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mesmo contrato do proxy do Vite em dev: /api/* -> API (sem o prefixo).
    location /api/ {
        proxy_pass http://time-tracker-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
