[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-tracker-cli"
version = "0.1.0"
description = "Interface de linha de comando do time-tracker."
requires-python = ">=3.9"
dependencies = ["time-tracker-core"]

[project.optional-dependencies]
dotenv = ["python-dotenv"]

[project.scripts]
time-tracker = "time_tracker_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
