[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-tracker-api"
version = "0.1.0"
description = "API HTTP (FastAPI) do time-tracker."
requires-python = ">=3.9"
dependencies = ["time-tracker-core", "fastapi", "uvicorn"]

[project.scripts]
time-tracker-api = "time_tracker_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
